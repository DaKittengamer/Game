<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=320, initial-scale=1">
    <meta charset="utf-8">
    <style>
      body, html {
        min-width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        font: Arial 14px;
      }
    </style>
    <script>
      let pointAmount = 0;
      let pointHighScore = 0;
      let pointsPerClick = 1;
      function updatePoints() {
        document.getElementById("points").innerHTML = pointAmount;
        if (pointAmount > pointHighScore) {
          pointHighScore = pointAmount;
        };
      };
      function eventChecker() {
        if (pointHighScore = 66) {
          pointsPerClick = 0.1;
          document.getElementById("announcements").innerHTML = "Sorry, but we can't let you make that number in this game.";
          document.getElementById("objective").innerHTML = "Objective: Find a way to bypass the restriction and type [REDACTED]";
        }; 
        if (pointHighScore = 66.9) {
          pointsPerClick = 0.01;
        };
      };
      setInterval(updatePoints, 10);
      setInterval(eventChecker, 10);
    </script>
  </head>
  <body>
    <p id="announcements"></p>
    <h1 id="points"></h1>
    <p id="objective"></p>
    <button onclick="pointAmount+=pointsPerClick">Its's a button!</button>
  </body>
</html>
